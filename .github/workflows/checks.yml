name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests use only Node built-ins, so no npm install is needed.
      - name: Jewelry site
        run: node --test test/*.test.mjs
      - name: Crystal Gallery
        run: node --test gallery/test/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crystal Gallery tools compile
        run: python -m py_compile gallery/tools/*.py
